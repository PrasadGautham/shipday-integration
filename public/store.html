<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Store Details</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/dashboard.css" />
  </head>
  <body>
    <div class="bg-layer"></div>
    <main class="shell">
      <header class="hero">
        <p class="eyebrow">Store Details</p>
        <h1 id="storeTitle">Loading store...</h1>
        <p id="storeMeta" class="subtle"></p>
      </header>

      <section class="panel">
        <div class="panel-head">
          <h2>Scope</h2>
          <a class="ghost-btn" href="/dashboard">Back to Overview</a>
        </div>
        <div id="storePicker" class="company-grid"></div>
        <div class="filters">
          <input id="fromDate" type="date" />
          <input id="toDate" type="date" />
          <button id="applyDate" class="ghost-btn">Apply Range</button>
        </div>
      </section>

      <section id="summaryCards" class="summary-grid"></section>

      <section class="panel">
        <div class="panel-head">
          <h2>Status Breakdown</h2>
        </div>
        <div id="statusBreakdown" class="company-grid"></div>
      </section>

      <section class="panel">
        <div class="panel-head">
          <h2>Orders</h2>
          <p id="orderCount" class="subtle"></p>
        </div>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>Order #</th>
                <th>Status</th>
                <th>Placed</th>
                <th>Delivered</th>
                <th>Total Mins</th>
                <th>Tracking</th>
              </tr>
            </thead>
            <tbody id="ordersBody"></tbody>
          </table>
        </div>
        <div id="storePagination" class="pagination"></div>
      </section>
    </main>
    <script src="/store.js"></script>
  </body>
</html>
